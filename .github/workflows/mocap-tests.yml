name: Mocap Integration Tests

on:
  push:
    branches: [ main, mocap-integration ]
    paths:
      - 'genesis_loco/mocap_integration/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'genesis_loco/mocap_integration/**'

jobs:
  test-mocap-integration:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Run fast mocap tests
      run: |
        cd genesis_loco/mocap_integration
        python3 test_mocap_simple.py
        
    - name: Run comprehensive mocap tests
      run: |
        cd genesis_loco/mocap_integration
        python3 test_mocap_real.py
        
    - name: Test summary
      if: always()
      run: |
        echo "✅ Mocap integration test suite completed"
        echo "📊 Tests validate 1,436 frames of real mocap data"
        echo "🤖 37-DOF humanoid joint mapping verified"